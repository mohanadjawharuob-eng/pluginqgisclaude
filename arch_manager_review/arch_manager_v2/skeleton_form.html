<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#fff; font-family: Arial, sans-serif; }
#wrapper { position:relative; width:595px; display:inline-block; }
#svg-bg { width:595px; height:auto; display:block; pointer-events:none; }
#overlay { position:absolute; top:0; left:0; width:595px; height:842px; }

/* Bone region base style */
.bone {
  position:absolute;
  cursor:pointer;
  border-radius:3px;
  transition: opacity 0.15s;
  opacity:0.0;
  border: 1.5px solid transparent;
}
.bone:hover { opacity:0.55 !important; border-color: #2244aa !important; }

/* Status colors matching the form legend */
.s-none      { background:transparent; opacity:0 !important; }
.s-complete  { background:#808080; opacity:0.55; }           /* grey filled */
.s-frag      { background:transparent; opacity:0.7; border:2px dashed #333 !important; }
.s-unknown   { background:transparent; opacity:0.7; border:2px solid #333 !important; }
.s-crushed   { background:repeating-linear-gradient(45deg,#555 0px,#555 2px,transparent 2px,transparent 6px); opacity:0.7; }
.s-sampled   { background:#f0c020; opacity:0.6; }            /* yellow */
.s-estimated { background:transparent; opacity:0.7; border:2px dotted #666 !important; }
.s-isolated  { background:transparent; opacity:0.7; border-radius:50%; border:2px solid #333 !important; }

/* Legend panel */
#legend { position:fixed; right:8px; top:8px; background:rgba(255,255,255,0.96);
  border:1px solid #ccc; padding:8px 12px; border-radius:4px; font-size:11px;
  box-shadow:2px 2px 6px rgba(0,0,0,0.2); min-width:180px; }
#legend h4 { font-size:12px; margin-bottom:6px; color:#333; border-bottom:1px solid #ddd; padding-bottom:4px; }
.leg-item { display:flex; align-items:center; gap:6px; margin:3px 0; cursor:pointer; padding:2px 4px; border-radius:3px; }
.leg-item:hover { background:#eee; }
.leg-item.active { background:#c8e0ff; }
.leg-swatch { width:18px; height:14px; border:1px solid #999; border-radius:2px; flex-shrink:0; }
.sw-complete { background:#808080; }
.sw-frag     { background:transparent; border:2px dashed #333; }
.sw-unknown  { background:transparent; border:2px solid #333; }
.sw-crushed  { background:repeating-linear-gradient(45deg,#555 0,#555 2px,transparent 2px,transparent 6px); }
.sw-sampled  { background:#f0c020; }
.sw-estimated{ background:transparent; border:2px dotted #666; }
.sw-isolated { background:transparent; border:2px solid #333; border-radius:50%; }
.sw-none     { background:#fff; }

#current-mode { background:#3a6; color:#fff; padding:3px 8px; border-radius:3px;
  font-size:11px; margin-bottom:6px; text-align:center; font-weight:bold; }
#tooltip { position:fixed; bottom:8px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,0.75); color:#fff; padding:4px 12px; border-radius:4px;
  font-size:11px; pointer-events:none; display:none; }
</style>

<script>
var currentMode = 'none';
var boneData = {};

function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.leg-item').forEach(function(el){ el.classList.remove('active'); });
  var el = document.getElementById('m-'+mode);
  if(el) el.classList.add('active');
  var labels = {'none':'Clear','complete':'Complete','frag':'Fragmentary',
    'unknown':'Precise ID/side unknown','crushed':'Highly Crushed',
    'sampled':'Sampled','estimated':'Estimated','isolated':'Tooth isolated'};
  document.getElementById('current-mode').textContent = 'Mode: ' + (labels[mode]||mode);
}

function click_bone(el) {
  var id = el.id;
  var title = el.title;
  // Remove all status classes
  el.className = 'bone';
  if(currentMode !== 'none') {
    el.classList.add('s-'+currentMode);
    boneData[id] = {status: currentMode, title: title};
  } else {
    delete boneData[id];
  }
  // Update opacity so we can see it
  if(currentMode === 'none') { el.style.opacity = '0'; }
  
  // Show tooltip
  var tt = document.getElementById('tooltip');
  var labels = {'none':'Cleared','complete':'Complete','frag':'Fragmentary',
    'unknown':'Precise ID/side unknown','crushed':'Highly Crushed',
    'sampled':'Sampled','estimated':'Estimated','isolated':'Tooth isolated'};
  tt.textContent = title + ': ' + (labels[currentMode]||currentMode);
  tt.style.display = 'block';
  setTimeout(function(){ tt.style.display='none'; }, 1800);
}

function clearAll() {
  document.querySelectorAll('.bone').forEach(function(el){
    el.className = 'bone'; el.style.opacity = '0';
  });
  boneData = {};
}

function saveData() {
  // Send data back to Python via Qt
  if(window.qt_bridge) {
    window.qt_bridge.receive_bone_data(JSON.stringify(boneData));
  }
}

function loadData(jsonStr) {
  clearAll();
  var data = JSON.parse(jsonStr);
  boneData = data;
  for(var id in data) {
    var el = document.getElementById(id);
    if(el) {
      el.className = 'bone s-'+data[id].status;
    }
  }
}

// Expose for Python
window.loadData = loadData;
</script>
